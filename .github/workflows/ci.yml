name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness (validate + verify-harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm verify-harness

  baseline:
    name: baseline (typecheck + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: baseline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  measure:
    name: árbitro (measure.mjs nas duas apps)
    runs-on: ubuntu-latest
    needs: [harness, baseline]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          pnpm -C harness install --frozen-lockfile
          pnpm -C baseline install --frozen-lockfile
          pnpm -C tools install --frozen-lockfile
      - run: pnpm -C tools measure ../baseline
      - run: pnpm -C tools measure ../harness
